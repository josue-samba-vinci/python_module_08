[project]
name = "ex1"
version = "2026.0.0"
description = "Load data with numpy, analyze it with pandas, render with matplotlib"
authors = [
    {name = "josamba-", email = "josamba-@student.42belgium.be"}
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy==1.25.0",
    "pandas==2.1.0",
    "matplotlib==3.7.2",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
